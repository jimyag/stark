{{ if .Store.Get "hasMermaid" }}
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';

    function getMermaidTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'forest';
    }

    const mermaidFontFamily = '"0xProto", "LXGW WenKai", "霞鹜文楷", "STKaiti", "Kaiti SC", ui-monospace, ui-serif, Georgia, serif';

    function getMermaidConfig() {
        return {
            startOnLoad: false,
            theme: getMermaidTheme(),
            securityLevel: 'loose',
            fontFamily: mermaidFontFamily,
            themeVariables: {
                fontFamily: mermaidFontFamily
            },
            flowchart: {
                useMaxWidth: true,
                htmlLabels: true
            },
            er: {
                useMaxWidth: true
            }
        };
    }

    async function renderMermaids() {
        const mermaidBlocks = document.querySelectorAll('.mermaid');
        if (mermaidBlocks.length === 0) return;

        mermaidBlocks.forEach((el) => {
            if (!el.dataset.mermaidSource) {
                el.dataset.mermaidSource = el.textContent.trim();
            }
            el.removeAttribute('data-processed');
            el.innerHTML = el.dataset.mermaidSource;
        });

        mermaid.initialize(getMermaidConfig());
        await mermaid.run({ querySelector: '.mermaid' });
        addMermaidClickHandlers();
    }
    
    // 为 mermaid 图表添加点击放大功能
    function addMermaidClickHandlers() {
        document.querySelectorAll('.mermaid').forEach((el) => {
            if (el.dataset.clickHandlerAdded) return;
            el.dataset.clickHandlerAdded = 'true';
            
            el.style.cursor = 'pointer';
            el.style.transition = 'transform 0.2s';
            el.setAttribute('role', 'button');
            el.setAttribute('aria-label', window.StarkI18n.imageClickZoom);
            el.setAttribute('tabindex', '0');
            
            el.addEventListener('click', (e) => {
                e.preventDefault();
                openMermaidLightbox(el);
            });
            
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openMermaidLightbox(el);
                }
            });
        });
    }
    
    function openMermaidLightbox(mermaidEl) {
        const lightbox = document.getElementById('mermaid-lightbox');
        const container = document.getElementById('mermaid-lightbox-container');
        const svg = mermaidEl.querySelector('svg');
        
        if (!svg) return;
        
        // 克隆 SVG
        const clonedSvg = svg.cloneNode(true);
        clonedSvg.style.width = '';
        clonedSvg.style.height = '';
        if (svg.getAttribute('viewBox')) {
            clonedSvg.setAttribute('viewBox', svg.getAttribute('viewBox'));
        }
        container.innerHTML = '';
        container.appendChild(clonedSvg);
        
        lightbox.classList.add('active');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        
        // 重置状态
        lightbox.dataset.zoom = '1';
        lightbox.dataset.translateX = '0';
        lightbox.dataset.translateY = '0';
        currentX = 0;
        currentY = 0;
        container.style.cursor = 'default';
        
        updateMermaidTransform(lightbox, 1, 0, 0);
    }
    
    function closeMermaidLightbox() {
        const lightbox = document.getElementById('mermaid-lightbox');
        lightbox.classList.remove('active');
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        document.getElementById('mermaid-lightbox-container').innerHTML = '';
        
        // 重置拖拽状态
        isDragging = false;
        currentX = 0;
        currentY = 0;
    }
    
    function updateMermaidTransform(lightbox, zoom, x, y) {
        const container = document.getElementById('mermaid-lightbox-container');
        const svg = container.querySelector('svg');
        if (svg) {
            // 先位移后缩放，这样位移不会受缩放影响
            svg.style.transform = `translate(${x}px, ${y}px) scale(${zoom})`;
            svg.style.transformOrigin = 'center center';
        }
        lightbox.dataset.zoom = zoom;
        lightbox.dataset.translateX = x;
        lightbox.dataset.translateY = y;
        
        // 更新鼠标样式
        container.style.cursor = zoom > 1 ? 'grab' : 'default';
    }
    
    // 拖拽相关变量
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;
    
    // 使用事件委托处理拖拽和滚轮
    document.addEventListener('mousedown', (e) => {
        const container = document.getElementById('mermaid-lightbox-container');
        if (!container || !container.contains(e.target)) return;
        
        const lightbox = document.getElementById('mermaid-lightbox');
        const zoom = parseFloat(lightbox.dataset.zoom) || 1;
        
        if (zoom > 1) {
            isDragging = true;
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
            container.style.cursor = 'grabbing';
            e.preventDefault();
        }
    });
    
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const lightbox = document.getElementById('mermaid-lightbox');
        if (!lightbox || !lightbox.classList.contains('active')) return;
        
        const zoom = parseFloat(lightbox.dataset.zoom) || 1;
        
        currentX = e.clientX - startX;
        currentY = e.clientY - startY;
        
        updateMermaidTransform(lightbox, zoom, currentX, currentY);
    });
    
    document.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            const container = document.getElementById('mermaid-lightbox-container');
            const lightbox = document.getElementById('mermaid-lightbox');
            if (lightbox && lightbox.classList.contains('active')) {
                const zoom = parseFloat(lightbox.dataset.zoom) || 1;
                container.style.cursor = zoom > 1 ? 'grab' : 'default';
            }
        }
    });
    
    // 滚轮缩放
    document.addEventListener('wheel', (e) => {
        const container = document.getElementById('mermaid-lightbox-container');
        if (!container || !container.contains(e.target)) return;
        
        const lightbox = document.getElementById('mermaid-lightbox');
        if (!lightbox || !lightbox.classList.contains('active')) return;
        
        e.preventDefault();
        
        let zoom = parseFloat(lightbox.dataset.zoom) || 1;
        const x = parseFloat(lightbox.dataset.translateX) || 0;
        const y = parseFloat(lightbox.dataset.translateY) || 0;
        
        // 滚轮向上放大，向下缩小
        if (e.deltaY < 0) {
            zoom = Math.min(4, zoom + 0.1);
        } else {
            zoom = Math.max(0.5, zoom - 0.1);
        }
        
        // 如果缩放回到1，重置位移
        if (zoom <= 1) {
            currentX = 0;
            currentY = 0;
            updateMermaidTransform(lightbox, zoom, 0, 0);
        } else {
            updateMermaidTransform(lightbox, zoom, x, y);
        }
    }, { passive: false });
    
    // 全局函数供按钮调用
    window.mermaidZoomIn = function() {
        const lightbox = document.getElementById('mermaid-lightbox');
        let zoom = parseFloat(lightbox.dataset.zoom) || 1;
        const x = parseFloat(lightbox.dataset.translateX) || 0;
        const y = parseFloat(lightbox.dataset.translateY) || 0;
        
        zoom = Math.min(4, zoom + 0.2);
        updateMermaidTransform(lightbox, zoom, x, y);
    };
    
    window.mermaidZoomOut = function() {
        const lightbox = document.getElementById('mermaid-lightbox');
        let zoom = parseFloat(lightbox.dataset.zoom) || 1;
        let x = parseFloat(lightbox.dataset.translateX) || 0;
        let y = parseFloat(lightbox.dataset.translateY) || 0;
        
        zoom = Math.max(0.5, zoom - 0.2);
        
        // 如果缩放回到1，重置位移
        if (zoom <= 1) {
            x = 0;
            y = 0;
            currentX = 0;
            currentY = 0;
        }
        
        updateMermaidTransform(lightbox, zoom, x, y);
    };
    
    window.mermaidResetView = function() {
        const lightbox = document.getElementById('mermaid-lightbox');
        currentX = 0;
        currentY = 0;
        updateMermaidTransform(lightbox, 1, 0, 0);
    };
    
    window.closeMermaidLightbox = closeMermaidLightbox;
    
    // 监听 mermaid 渲染完成
    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
                if (node.nodeType === 1) {
                    if (node.classList && node.classList.contains('mermaid')) {
                        setTimeout(() => addMermaidClickHandlers(), 100);
                    } else if (node.querySelectorAll) {
                        const mermaids = node.querySelectorAll('.mermaid');
                        if (mermaids.length > 0) {
                            setTimeout(() => addMermaidClickHandlers(), 100);
                        }
                    }
                }
            });
        });
    });
    
    observer.observe(document.body, {
        childList: true,
        subtree: true
    });
    
    document.addEventListener('stark:theme-change', () => {
        closeMermaidLightbox();
        renderMermaids().catch((err) => {
            console.error('Failed to re-render mermaid diagrams', err);
        });
    });

    renderMermaids().catch((err) => {
        console.error('Failed to render mermaid diagrams', err);
    });
    
    // 键盘事件支持
    document.addEventListener('keydown', (e) => {
        const lightbox = document.getElementById('mermaid-lightbox');
        if (!lightbox || !lightbox.classList.contains('active')) return;
        
        if (e.key === 'Escape') {
            closeMermaidLightbox();
        } else if (e.key === ' ' || e.key === '0') {
            // 空格键或0键重置视图
            e.preventDefault();
            mermaidResetView();
        } else if (e.key === '+' || e.key === '=') {
            mermaidZoomIn();
        } else if (e.key === '-') {
            mermaidZoomOut();
        }
    });
</script>

<!-- Mermaid Lightbox HTML -->
<div id="mermaid-lightbox" class="mermaid-lightbox" aria-hidden="true">
    <div id="mermaid-lightbox-container"></div>
    <div class="mermaid-lightbox-controls">
        <button onclick="mermaidZoomOut()" aria-label="{{ i18n "mermaid_zoom_out" }}">−</button>
        <button onclick="mermaidResetView()" aria-label="{{ i18n "mermaid_reset" }}">⟲</button>
        <button onclick="mermaidZoomIn()" aria-label="{{ i18n "mermaid_zoom_in" }}">+</button>
        <button onclick="closeMermaidLightbox()" aria-label="{{ i18n "mermaid_close" }}">×</button>
    </div>
</div>
{{ end }}

{{- $script := resources.Get "js/stark.js" | minify | fingerprint -}}
<script defer src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}"></script>
