{{- $toc := partial "article-toc.html" . -}}
{{ if and $toc (gt (len $toc) 100) }}
<!-- Sidebar TOC (wide screen) -->
<aside class="toc toc-sidebar">
  <details open>
    <summary>{{ i18n "toc" }}</summary>
    <nav>
      {{ $toc }}
    </nav>
  </details>
</aside>

<!-- Floating TOC button (narrow screen) -->
<button type="button" class="toc-toggle" aria-label="{{ i18n "toc_show" }}" aria-controls="toc-modal" aria-expanded="false">{{ i18n "toc" }}</button>

<!-- TOC modal panel (narrow screen) -->
<div id="toc-modal" class="toc-modal" role="dialog" aria-modal="true" aria-labelledby="toc-modal-title" hidden>
  <div class="toc-modal-content">
    <div class="toc-modal-header">
      <h2 id="toc-modal-title">{{ i18n "toc" }}</h2>
      <button type="button" class="toc-modal-close" aria-label="{{ i18n "toc_close" }}">&times;</button>
    </div>
    <nav>
      {{ $toc }}
    </nav>
  </div>
</div>

<script>
(function() {
  const toggle = document.querySelector('.toc-toggle');
  const modal = document.querySelector('.toc-modal');
  const closeBtn = document.querySelector('.toc-modal-close');
  let lastFocus;

  if (!toggle || !modal) return;

  toggle.addEventListener('click', () => {
    lastFocus = document.activeElement;
    modal.classList.add('active');
    modal.hidden = false;
    toggle.setAttribute('aria-expanded', 'true');
    closeBtn.focus();
  });

  function closeModal() {
    modal.classList.remove('active');
    modal.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
    if (lastFocus) lastFocus.focus();
  }

  closeBtn.addEventListener('click', closeModal);

  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      closeModal();
    }
  });

  modal.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      closeModal();
    });
  });

  modal.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      return;
    }
    if (e.key !== 'Tab') return;
    const focusable = [...modal.querySelectorAll('button, a[href]')];
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });
})();
</script>
{{ end }}
