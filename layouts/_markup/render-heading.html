<h{{ .Level }} id="{{ .Anchor | safeURL }}"{{ range $k, $v := .Attributes }}{{ if ne $k "id" }}{{ printf " %s=%q" $k $v | safeHTMLAttr }}{{ end }}{{ end }}>
  <a class="heading-anchor" href="#{{ .Anchor | safeURL }}" aria-label="{{ .PlainText }}">
    {{- .Text | safeHTML -}}
  </a>
</h{{ .Level }}>
