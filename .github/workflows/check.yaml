name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      - run: npm ci
      - name: Test MDX
        run: node --test tests/*.test.mjs
